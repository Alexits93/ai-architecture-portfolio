# The FAQ on home, shown by `order` (src/content.config.ts).
- id: agent-harness
  order: 1
  question: What is an agent harness?
  answer: The instructions, permissions, hooks and tests around a coding agent, so its work is checked before a person reviews it.
- id: ai-writing
  order: 2
  question: Do you use AI to write the blog?
  answer: No. I write every article myself, by hand, without AI-generated text.
