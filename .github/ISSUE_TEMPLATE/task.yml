name: Task
description: One change that ships as one PR.
title: "[Task] "
labels: ["task"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What changes and why. Add a mermaid diagram only where a flow is hard to describe in words."
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: "A checklist of observable outcomes, each one a test or a live check."
      placeholder: |
        - [ ] ...
    validations:
      required: true
