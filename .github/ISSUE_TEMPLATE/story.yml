name: Story
description: Define a user story linked to an Epic.
title: "[Story] "
labels: ["story"]
body:
  - type: markdown
    attributes:
      value: "Set the parent Epic as a native sub-issue link (Relationships in the sidebar, or `gh issue create --parent N`). CI pr-lint fails a PR whose Story has no parent."
  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: "Format: As a [role], I want to [action] so that [benefit]."
      placeholder: As a...
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Specific conditions that must be met for the story to be complete.
      placeholder: - [ ] Condition 1...
    validations:
      required: true
