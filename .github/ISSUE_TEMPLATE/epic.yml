name: Epic
description: Define a high-level goal encompassing multiple stories and tasks.
title: "[Epic] "
labels: ["epic"]
body:
  - type: markdown
    attributes:
      value: "Thanks for creating an Epic! Make sure this encompasses a significant, overarching goal."
  - type: textarea
    id: goal
    attributes:
      label: High-Level Goal
      description: What is the main objective of this epic?
      placeholder: Describe the goal...
    validations:
      required: true
  - type: textarea
    id: success-metrics
    attributes:
      label: Success Metrics
      description: How will we know this Epic is successfully completed?
      placeholder: Describe the success metrics...
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context, references, or links?
    validations:
      required: false
