name: CI/CD Pipeline

# No push trigger: ruleset 24675871 requires up-to-date branches, so a push run on master would repeat the PR run.
on:
  pull_request:
    branches: ["master", "main"]
  merge_group:
    branches: ["master", "main"]

# Cancel a superseded run for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  quality-gate:
    name: Code Quality (Lint, Typecheck, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-pnpm-env

      - name: Enforce Formatting & Linting
        run: pnpm exec eslint .

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm exec vitest run --coverage --passWithNoTests --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Report Coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          name: 'Vitest Coverage'
          json-summary-path: 'coverage/coverage-summary.json'
          json-final-path: 'coverage/coverage-final.json'

      - name: Publish Test Results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: Unit Tests Report
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: 'false'

  security-gate:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-pnpm-env

      - name: pnpm Audit (Supply Chain Security)
        run: pnpm audit --prod --audit-level=high

  build-gate:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [quality-gate, security-gate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-pnpm-env

      - name: Astro Build
        run: pnpm run build

  e2e-gate:
    name: E2E (Playwright, all engines)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality-gate, security-gate]
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idpermissions
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-pnpm-env

      # https://playwright.dev/docs/ci-intro
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Astro Build
        run: pnpm run build

      - name: Playwright Tests
        run: pnpm test:e2e
