name: CI/CD Pipeline

# No push trigger: ruleset 24675871 requires up-to-date branches, so a push run on master would repeat the PR run.
on:
  pull_request:
    branches: ["master"]

# Cancel a superseded run for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Each timeout-minutes is about twice the job's slowest run in the last 50 runs (#313); the default is 360
# (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idtimeout-minutes).
jobs:
  quality-gate:
    name: Code Quality (Lint, Typecheck, Test)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      checks: write # dorny/test-reporter creates the check run
      pull-requests: write # vitest-coverage-report-action comments on the PR
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-pnpm-env

      - name: Enforce Formatting & Linting
        run: pnpm exec eslint .

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm exec vitest run --coverage --passWithNoTests --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Report Coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          name: 'Vitest Coverage'
          json-summary-path: 'coverage/coverage-summary.json'
          json-final-path: 'coverage/coverage-final.json'

      - name: Publish Test Results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: Unit Tests Report
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: 'false'

  security-gate:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-pnpm-env

      - name: pnpm Audit (Supply Chain Security)
        run: pnpm audit --audit-level=high

  build-gate:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [quality-gate, security-gate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-pnpm-env

      - name: Astro Build
        run: pnpm run build

  # One job per engine, in parallel and alongside the other gates (#293): on one worker the whole suite took 7.4 minutes
  # in one job. Each job keeps one worker, as https://playwright.dev/docs/ci recommends for stability.
  e2e-engine:
    name: E2E (${{ matrix.engine }})
    runs-on: ubuntu-latest
    # Leaves room for setup after the 7-minute Playwright globalTimeout, so Playwright stops first and reports.
    timeout-minutes: 10
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idpermissions
    permissions:
      contents: read
    strategy:
      # Every engine reports its own result, even when another fails.
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            projects: --project=chromium --project=chromium-bfcache
          - engine: firefox
            projects: --project=firefox
          - engine: webkit
            projects: --project=webkit
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-pnpm-env

      # Only this job's browser and its system dependencies (https://playwright.dev/docs/browsers#install-browsers).
      - name: Install Playwright Browser
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}

      - name: Astro Build
        run: pnpm run build

      - name: Playwright Tests
        run: pnpm test:e2e ${{ matrix.projects }}

  # Ruleset 24675871 requires this check name. A skipped required check counts as passed, so the job always runs and
  # passes only when every engine job succeeded
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idneeds).
  e2e-gate:
    name: E2E (Playwright, all engines)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [e2e-engine]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: Every engine passed
        run: test "${{ needs.e2e-engine.result }}" = success
