name: CI/CD Pipeline

# No push trigger: ruleset 24675871 requires up-to-date branches, so a push run on master would repeat the PR run.
on:
  pull_request:
    branches: ["master"]

# Cancel a superseded run for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Each timeout-minutes is about twice the job's slowest run in the last 50 runs; the default is 360
# (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idtimeout-minutes).
jobs:
  quality-gate:
    name: Code Quality (Lint, Typecheck, Test)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-pnpm-env

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test

  security-gate:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-pnpm-env

      - name: pnpm Audit (Supply Chain Security)
        run: pnpm audit --audit-level=high

  # The e2e container tag must match the installed @playwright/test, whose browsers the image ships.
  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout Lockfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - name: Read Version
        id: read
        run: |
          version=$(grep -m1 -oP "^  '@playwright/test@\K[0-9.]+(?=':)" pnpm-lock.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # One job per engine, in parallel and alongside the other gates: on one worker the whole suite took 7.4 minutes
  # in one job. Each job keeps one worker, as https://playwright.dev/docs/ci recommends for stability.
  # The jobs run in the Playwright image, which ships the browsers and their system libraries. Installing them in the
  # job stalled twice on the Ubuntu apt mirror until the job timeout (runs 40210373092 and 40213658255)
  # (https://playwright.dev/docs/ci#via-containers).
  e2e-engine:
    name: E2E (${{ matrix.engine }})
    needs: [playwright-version]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # The runner's user, so the checkout and the pnpm cache stay writable.
      options: --user 1001
    # Leaves room for setup after the 7-minute Playwright globalTimeout, so Playwright stops first and reports.
    timeout-minutes: 10
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idpermissions
    permissions:
      contents: read
    strategy:
      # Every engine reports its own result, even when another fails.
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            projects: --project=chromium --project=chromium-bfcache
          - engine: firefox
            projects: --project=firefox
          - engine: webkit
            projects: --project=webkit
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-pnpm-env

      - name: Astro Build
        run: pnpm run build

      - name: Playwright Tests
        run: pnpm test:e2e ${{ matrix.projects }}

  # Ruleset 24675871 requires this check name. A skipped required check counts as passed, so the job always runs and
  # passes only when every engine job succeeded
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idneeds).
  e2e-gate:
    name: E2E (Playwright, all engines)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [e2e-engine]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: Every engine passed
        run: test "${{ needs.e2e-engine.result }}" = success
