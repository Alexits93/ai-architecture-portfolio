name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Environment
        uses: ./.github/actions/setup-pnpm-env

      # The PR title becomes the squash commit on master.
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

      # Same rules as the local .claude/hooks/pr-gate.mjs.
      - name: Check PR description
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { findPrBodyViolations } = await import(`${process.env.GITHUB_WORKSPACE}/.github/workflow-rules.mjs`);
            const violations = findPrBodyViolations(context.payload.pull_request.body ?? '');
            if (violations.length > 0) core.setFailed(violations.join('\n'));
