name: PR Lint

# pull_request_target runs this file from master, so a PR cannot weaken the checks that run on it. No step runs
# PR code; the title and body are read as data (https://docs.github.com/en/actions/reference/security/secure-use).
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-lint:
    runs-on: ubuntu-latest
    steps:
      # No ref: for this event it is master (https://github.com/actions/checkout, v7.0.1).
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-pnpm-env

      # Squash merge only: the PR title becomes the commit on master.
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

      # GitHub's closing keywords (https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/linking-a-pull-request-to-an-issue).
      - name: Check the PR closes an issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" | grep -qiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? #[0-9]+' || { echo "The PR body must close an issue, for example 'Closes #123'."; exit 1; }
