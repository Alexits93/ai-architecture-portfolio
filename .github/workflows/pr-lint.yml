name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read

jobs:
  pr-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit range check needs the base and head commits.
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-pnpm-env

      # Squash merge only: the PR title becomes the commit on master.
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

      # The squash body keeps the commit messages; semantic-release reads their footers.
      - name: Check PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # Same rules as the local .claude/hooks/pr-gate.mjs.
      - name: Check PR description
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { findPrBodyViolations } = await import(`${process.env.GITHUB_WORKSPACE}/.github/workflow-rules.mjs`);
            const violations = findPrBodyViolations(context.payload.pull_request.body ?? '');
            if (violations.length > 0) core.setFailed(violations.join('\n'));

      # Each "Closes #N" is an open Story or Task with a native parent issue.
      - name: Check linked issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const rules = await import(`${process.env.GITHUB_WORKSPACE}/.github/workflow-rules.mjs`);
            const violations = [];
            for (const number of rules.closedIssueNumbers(context.payload.pull_request.body ?? '')) {
              const data = await github.graphql(rules.LINKED_ISSUE_QUERY, { ...context.repo, number }).catch(() => null);
              violations.push(...rules.findLinkedIssueViolations(number, data?.repository?.issue ?? null));
            }
            if (violations.length > 0) core.setFailed(violations.join('\n'));
